name: Journal readiness check

# Runs the free Public Readiness check against the seven journal projects from
# a machine that can actually reach them — the session environment's network
# policy cannot. No provider key is involved: this rung makes no paid call.
# The result is kept as an artifact so a person reads and approves the wording
# before any of it becomes a journal entry.

on:
  workflow_dispatch:
  schedule:
    # Mondays 03:00 UTC — an hour after the Search Console pull, so both
    # halves of a week's picture land together.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check every project's public readiness
        run: npm run journal:readiness

      - name: Keep the readiness report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-readiness
          path: reports/readiness/
          retention-days: 90
          if-no-files-found: ignore
