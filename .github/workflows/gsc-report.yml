name: Search Console report

# Runs the Search Console pull without anyone opening a terminal: press
# "Run workflow" here, or let the Monday schedule do it. The report is kept as
# an access-controlled downloadable artifact and never printed or committed,
# because it carries live performance data for every property.

on:
  workflow_dispatch:
  schedule:
    # Mondays 02:00 UTC — Search Console data for the previous week has landed.
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Search Console performance
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_EXPECTED_SERVICE_ACCOUNT: ${{ vars.GSC_EXPECTED_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "### Ключ не найден" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавьте секрет \`GOOGLE_SERVICE_ACCOUNT_JSON\` в Settings → Secrets and variables → Actions, затем запустите отчёт снова." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$GSC_EXPECTED_SERVICE_ACCOUNT" ]; then
            echo "### Ожидаемый аккаунт не задан" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавьте переменную \`GSC_EXPECTED_SERVICE_ACCOUNT\` в Settings → Secrets and variables → Actions → Variables." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm run gsc:report

      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-console-report
          path: reports/gsc/
          retention-days: 90
          if-no-files-found: ignore
