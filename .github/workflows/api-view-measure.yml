name: API View measurement

# Asks the catalog's five API models the project's questions and reports whether
# the brand comes back. This spends money on the OpenRouter account, so it never
# runs on a schedule — only when someone presses "Run workflow".
#
# It measures API View: what a model answers from its own knowledge. What a
# person sees on chatgpt.com is Visitor View, a different channel that needs a
# different provider, and it is not measured here.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug"
        required: true
        default: korafoodhall
        type: choice
        options:
          - korafoodhall
          - bigdragonvillas
          - chitobistro
          - otherbali
          - petid
          - remhaos
          - selenasystems
          - villaops
      max_cost_usd:
        description: "Hard spend ceiling for this run, in USD"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ask the models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MEASURE_PROJECT: ${{ inputs.project }}
          MEASURE_MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "### Ключ не найден" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавьте секрет \`OPENROUTER_API_KEY\` в Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm run measure:api-view

      - name: Keep the measurement as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-view-measurement
          path: reports/api-view/
          retention-days: 90
          if-no-files-found: ignore
